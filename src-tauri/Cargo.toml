[package]
name = "diskmind"
version = "0.1.0"
description = "Fast disk space analyzer with history diff"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
bincode = "1.3"
flate2 = "1"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# 自己的代码只保留行号表（.pdb 小很多）：panic/堆栈仍有文件和行号，调试器里看不到局部变量
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# 依赖库不生成调试信息，大幅缩小 target
debug = false
